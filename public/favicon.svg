<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5b85c"/>
      <stop offset="50%" stop-color="#c99632"/>
      <stop offset="100%" stop-color="#a6751d"/>
    </linearGradient>
    <linearGradient id="royalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="46" fill="#fffcf7" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Vasavi Monogram 'V' -->
  <path d="M28 26 L48 76 Q50 80 52 76 L72 26" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Inner Royal Accent -->
  <path d="M38 26 L50 62 L62 26" fill="none" stroke="url(#royalGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Crown Sparkle Accent -->
  <polygon points="50,14 53,21 60,21 54,25 57,32 50,28 43,32 46,25 40,21 47,21" fill="url(#goldGrad)"/>
</svg>